":"2026-11-09T23:30:39Z","updated_at":"2026-11-09T23:30:44Z"},{"id":729375705,"node_id":"RA_kwDOJ0Z1Ps4reWPZ","name":"OllamaSetup.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1857663944,"digest":"sha256:84db4f756ddc9e091142a85cdc0f7ae5db68bc9b3e075f114388b326f8ed912d","download_count":891405,"created_at":"2026-11-09T23:30:38Z","updated_at":"2026-11-09T23:31:17Z"},{"id":729379712,"node_id":"RA_kwDOJ0Z1Ps4reXOA","name":"sha256sum.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain; charset=utf-8","state":"uploaded","size":1472,"digest":"sha256:99d2505da1bfa40d582e295825d232763823667b495bd73e2145e94671c28eb9","download_count":10910,"created_at":"2026-11-09T23:32:07Z","updated_at":"2026-11-09T23:32:07Z"}],"body":"## Ripple Preview\r\n\r\n[Ripple Preview](https://ollama.com/library/ripple-preview) from Ricursive Intelligence is a 65B dense model built for agentic coding.\r\n\r\n```sh\r\nollama run ripple-preview\r\n```\r\n\r\n## What's Changed\r\n\r\n- Qwen3.8 Flash Next uses about 27 GiB less memory on Apple silicon\r\n- `ollama launch claude` always routes Claude Code to the selected model\r\n- `ollama launch` explains when a cloud model has been retired\r\n- `/v1/responses` respects `truncation` and no longer silently truncates by default\r\n- `/v1/models` returns an empty list instead of `null` when no models are installed\r\n- CUDA 13.5 support for Windows on ARM\r\n- Updated llama.cpp\r\n\r\n**Full Changelog**: https://github.com/ollama/ollama/compare/v0.40.15...v0.40.16","reactions":{"total_count":34,"+1":19,"-1":0,"laugh":1,"hooray":4,"confused":0,"heart":3,"rocket":4,"eyes":3}}
